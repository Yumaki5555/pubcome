# 毎朝7時（日本時間）に e-Gov・47都道府県・主な市区町村から情報を集め、ページと投稿文を作り直して公開する
name: daily-update

on:
  schedule:
    - cron: "0 22 * * *"   # 世界標準時の22時 = 日本時間の朝7時
  workflow_dispatch:        # 手動でも実行できるようにする

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 情報を集める
        run: python fetch.py
      - name: 一覧ページを作る
        run: python build.py
      - name: X投稿文を作る
        run: python post.py
      - name: 都道府県のパブコメを集める
        run: python 都道府県レベル/fetch.py
        continue-on-error: true   # 県のサイトが不調でも、国版の更新は止めない
      - name: 都道府県版のページを作る
        run: python 都道府県レベル/build.py
      - name: 市区町村のパブコメを集める
        run: python 市区町村レベル/fetch.py
        continue-on-error: true   # 市区のサイトが不調でも、ほかの更新は止めない
      - name: 市区町村版のページを作る
        run: python 市区町村レベル/build.py
      - name: 変更を保存して公開
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json posts.txt docs 都道府県レベル/data.json 市区町村レベル/data.json
          git diff --cached --quiet || git commit -m "毎日の自動更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git push
